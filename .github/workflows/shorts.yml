name: daily-shorts

on:
  schedule:
    - cron: '35 2 * * *'   # publish 3 UTC (supernatural)
    - cron: '05 3 * * *'   # publish 3:30 UTC (supernatural)
    - cron: '35 3 * * *'   # publish 4 UTC (survival)
    - cron: '35 5 * * *'   # publish 6 UTC (survival)
    - cron: '35 15 * * *'   # publish 16 UTC (supernatural)
    - cron: '05 16 * * *'   # publish 16:30 UTC (survival)
    - cron: '35 16 * * *'   # publish 17 UTC (survival)
    - cron: '05 17 * * *'   # publish 17:30 UTC (survival)
  workflow_dispatch:
    inputs:
      category:
        description: 'Which category to run'
        required: false
        default: 'supernatural'
        type: choice
        options:
          - supernatural
          - survival
          - whatif
      publish_hour:
        description: 'Publish hour UTC, or "now"'
        required: false
        default: 'now'
        type: choice
        options:
          - now
          - '3'
          - '3:30'
          - '4'
          - '6'
          - '16'
          - '16:30'
          - '17'
          - '17:30'

jobs:
  manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CATEGORY: ${{ github.event.inputs.category || 'supernatural' }}
      PUBLISH_HOUR_UTC: ${{ github.event.inputs.publish_hour || 'now' }}
      PREVIEW_TITLES: ${{ github.event.inputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
          pip install --quiet -r requirements.txt
      - name: Inject secrets
        env:
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          POLL: ${{ secrets.POLLINATIONS_KEY }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open('config.json', encoding='utf-8'))
          cfg['gemini_api_key'] = os.environ.get('GEMINI', '')
          cfg['pollinations_key'] = os.environ.get('POLL', '')
          json.dump(cfg, open('config.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('config ready')
          PY
      - name: Generate and upload video (1 retry)
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TTK_CLIENT_KEY: ${{ secrets.TTK_CLIENT_KEY }}
          TTK_CLIENT_SECRET: ${{ secrets.TTK_CLIENT_SECRET }}
          TTK_REFRESH_TOKEN: ${{ secrets.TTK_REFRESH_TOKEN }}
        run: |
          python pipeline.py
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::First attempt failed (rc=$rc) - retrying ONCE"
            python pipeline.py
            rc=$?
          fi
          exit $rc

