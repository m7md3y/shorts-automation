name: daily-shorts

on:
  schedule:
    - cron: '0 11 * * *'  # prepare -> publish 00:00 UTC = 8:00 PM US Eastern
    - cron: '0 12 * * *'  # prepare -> publish 01:00 UTC = 9:00 PM US Eastern
    - cron: '0 13 * * *'  # prepare -> publish 02:00 UTC = 10:00 PM US Eastern
  workflow_dispatch: {}

jobs:
  explained:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *') }}
    runs-on: ubuntu-latest
    env:
      CATEGORY: explained
      PUBLISH_HOUR_UTC: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
          pip install --quiet -r requirements.txt
      - name: Inject secrets
        env:
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          POLL: ${{ secrets.POLLINATIONS_KEY }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open('config.json', encoding='utf-8'))
          cfg['gemini_api_key'] = os.environ.get('GEMINI', '')
          cfg['pollinations_key'] = os.environ.get('POLL', '')
          json.dump(cfg, open('config.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('config ready')
          PY
      - name: Generate and upload video (1 retry)
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TTK_CLIENT_KEY: ${{ secrets.TTK_CLIENT_KEY }}
          TTK_CLIENT_SECRET: ${{ secrets.TTK_CLIENT_SECRET }}
          TTK_REFRESH_TOKEN: ${{ secrets.TTK_REFRESH_TOKEN }}
        run: |
          python pipeline.py
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::First attempt failed (rc=$rc) - retrying ONCE"
            python pipeline.py
            rc=$?
          fi
          exit $rc

  mystery:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') }}
