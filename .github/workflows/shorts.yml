name: daily-shorts

on:
  schedule:
    - cron: '25 23 * * *'   # prepare -> publish 00:00 UTC (whatif)
    - cron: '25 2 * * *'   # prepare -> publish 03:00 UTC (whatif)
    - cron: '25 5 * * *'   # prepare -> publish 06:00 UTC (whatif)
    - cron: '25 8 * * *'   # prepare -> publish 09:00 UTC (mystery)
    - cron: '25 11 * * *'   # prepare -> publish 12:00 UTC (explained)
    - cron: '25 14 * * *'   # prepare -> publish 15:00 UTC (mystery)
    - cron: '25 17 * * *'   # prepare -> publish 18:00 UTC (explained)
    - cron: '25 20 * * *'   # prepare -> publish 21:00 UTC (whatif)
  workflow_dispatch:
    inputs:
      category:
        description: 'Which category to run'
        required: false
        default: 'whatif'
        type: choice
        options:
          - whatif
          - explained
          - mystery
      publish_hour:
        description: 'Publish hour UTC, or "now" for immediate'
        required: false
        default: 'now'
        type: choice
        options:
          - now
          - '0'
          - '3'
          - '6'
          - '9'
          - '12'
          - '15'
          - '18'
          - '21'

jobs:
  manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CATEGORY: ${{ github.event.inputs.category || 'whatif' }}
      PUBLISH_HOUR_UTC: ${{ github.event.inputs.publish_hour || 'now' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
          pip install --quiet -r requirements.txt
      - name: Inject secrets
        env:
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          POLL: ${{ secrets.POLLINATIONS_KEY }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open('config.json', encoding='utf-8'))
          cfg['gemini_api_key'] = os.environ.get('GEMINI', '')
          cfg['pollinations_key'] = os.environ.get('POLL', '')
          json.dump(cfg, open('config.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('config ready')
          PY
      - name: Generate and upload video (1 retry)
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TTK_CLIENT_KEY: ${{ secrets.TTK_CLIENT_KEY }}
          TTK_CLIENT_SECRET: ${{ secrets.TTK_CLIENT_SECRET }}
          TTK_REFRESH_TOKEN: ${{ secrets.TTK_REFRESH_TOKEN }}
        run: |
          python pipeline.py
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::First attempt failed (rc=$rc) - retrying ONCE"
            python pipeline.py
            rc=$?
          fi
          exit $rc

