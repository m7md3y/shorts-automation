name: daily-shorts

on:
  schedule:
    - cron: '00 12 * * *'   # publish 12 UTC (survival)
    - cron: '00 14 * * *'   # publish 14 UTC (survival)
    - cron: '00 16 * * *'   # publish 16 UTC (supernatural)
    - cron: '00 18 * * *'   # publish 18 UTC (survival)
    - cron: '00 20 * * *'   # publish 20 UTC (supernatural)
    - cron: '00 22 * * *'   # publish 22 UTC (survival)
    - cron: '00 0 * * *'   # publish 0 UTC (supernatural)
    - cron: '00 2 * * *'   # publish 2 UTC (survival)
  workflow_dispatch:
    inputs:
      category:
        description: 'Which category to run'
        required: false
        default: 'supernatural'
        type: choice
        options:
          - supernatural
          - survival
      publish_hour:
        description: 'Publish hour UTC, or "now"'
        required: false
        default: 'now'
        type: choice
        options:
          - now
          - '12'
          - '14'
          - '16'
          - '18'
          - '20'
          - '22'
          - '0'
          - '2'
      preview:
        description: 'Preview titles only'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      CATEGORY: ${{ github.event.inputs.category || 'supernatural' }}
      PUBLISH_HOUR_UTC: ${{ github.event.inputs.publish_hour || 'now' }}
      PREVIEW_TITLES: ${{ github.event.inputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
          pip install --quiet -r requirements.txt
      - name: Inject secrets
        env:
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          POLL: ${{ secrets.POLLINATIONS_KEY }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open('config.json', encoding='utf-8'))
          cfg['gemini_api_key'] = os.environ.get('GEMINI', '')
          cfg['pollinations_key'] = os.environ.get('POLL', '')
          json.dump(cfg, open('config.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('config ready')
          PY
      - name: Check start date (no publish before Sept 3)
        run: |
          if [ "$(date -u +%Y-%m-%d)" \< "2026-09-03" ]; then
            echo "Before 2026-09-03, skipping scheduled publish"
            exit 78
          fi
      - name: Generate and upload video (1 retry)
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TTK_CLIENT_KEY: ${{ secrets.TTK_CLIENT_KEY }}
          TTK_CLIENT_SECRET: ${{ secrets.TTK_CLIENT_SECRET }}
          TTK_REFRESH_TOKEN: ${{ secrets.TTK_REFRESH_TOKEN }}
        run: |
          python pipeline.py
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::First attempt failed (rc=$rc) - retrying ONCE"
            python pipeline.py
            rc=$?
          fi
          exit $rc

