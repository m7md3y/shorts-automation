name: daily-shorts

on:
  schedule:
    - cron: '0 7 * * *'   # 10:00 SYR - Explained
    - cron: '0 12 * * *'  # 15:00 SYR - Mystery
    - cron: '0 17 * * *'  # 20:00 SYR - What If
  workflow_dispatch: {}

jobs:
  explained:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') }}
    runs-on: ubuntu-latest
    env:
      CATEGORY: explained
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
          pip install --quiet -r requirements.txt
      - name: Inject secrets
        env:
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          POLL: ${{ secrets.POLLINATIONS_KEY }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open('config.json', encoding='utf-8'))
          cfg['gemini_api_key'] = os.environ.get('GEMINI', '')
          cfg['pollinations_key'] = os.environ.get('POLL', '')
          json.dump(cfg, open('config.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('config ready')
          PY
      - name: Generate and upload video
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline.py

  mystery:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') }}
    runs-on: ubuntu-latest
    env:
      CATEGORY: mystery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
